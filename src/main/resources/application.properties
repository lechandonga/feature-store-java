spring.application.name=feature-store-java
server.port=8080

# Local JSON snapshot directory (atomic write, replayed on startup)
feature-store.data-dir=${FEATURE_STORE_DATA_DIR:./data}

# Structured decision audit trail: console plus a dedicated, greppable file.
# Every line carries action/featureSet/version/entity/eventTime/decision/reason.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
